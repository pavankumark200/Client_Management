<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — InsuranceCMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">🛡️</div>
      <h1>InsuranceCMS</h1>
      <p>Sign in to your account</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">⚠️ {{ error }}</div>
    {% endif %}

    {% if request.args.get('timeout') %}
    <div class="alert alert-warning">⏰ Session expired. Please log in again.</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required
               placeholder="Enter username" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required
               placeholder="Enter password" autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn btn-primary login-btn">🔐 Sign In</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:.8rem;color:var(--text-muted)">
      Default: <strong>admin</strong> / <strong>Admin@1234</strong>
    </p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
